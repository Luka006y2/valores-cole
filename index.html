<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Error 1024: You are being rate limited</title>
<style>
body{
  background:#f6f6f6;
  font-family: Arial, sans-serif;
  text-align:center;
  padding-top:100px;
}

.box{
  background:white;
  width:500px;
  margin:auto;
  padding:30px;
  border-radius:8px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
  color:#cc0000;
}

p{
  color:#333;
}
</style>
</head>

<body>

<div class="box">
<h1>Error 1024</h1>
<h2>You are being rate limited</h2>

<p>You have sent too many requests in a given amount of time.</p>

<p>Please wait a few minutes and try again.</p>

<p>If you believe this is an error, contact the site administrator.</p>

</div>

</body>
</html>
